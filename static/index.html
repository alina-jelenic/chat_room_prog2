<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f3ef;
      --surface:   #ffffff;
      --sidebar:   #1a1816;
      --border:    #e2ddd6;
      --text:      #1a1816;
      --muted:     #8a857d;
      --accent:    #2a6049;
      --accent-h:  #1f4a37;
      --radius:    10px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      color: var(--text);
      background: var(--bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 0;
      color: #c8c3bc;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: 1.25rem;
      color: #fff;
      letter-spacing: -.01em;
    }

    .user-pill {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem;
      font-weight: 500;
      color: #fff;
      flex-shrink: 0;
    }

    .user-name {
      font-size: .8rem;
      color: #a09990;
      font-weight: 400;
    }

    .section-label {
      padding: 20px 20px 8px;
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #5a5550;
      font-weight: 500;
    }

    .room-list { flex: 1; overflow-y: auto; padding-bottom: 12px; }

    .room-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      font-size: .85rem;
      color: #8a857d;
      cursor: pointer;
      border-radius: 0;
      transition: background .15s, color .15s;
      user-select: none;
      width: 100%;
      border: 0;
      background: transparent;
      font-family: inherit;
      text-align: left;
    }

    .room-item::before { content: ''; font-size: .75rem; color: #5a5550; }

    .room-item:hover   { background: rgba(255,255,255,.05); color: #d0cbc4; }
    .room-item.active  { background: rgba(255,255,255,.08); color: #fff; }
    .room-item.active::before { color: var(--accent); }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,.07);
      font-size: .78rem;
    }

    .logout-btn {
      background: none; border: none;
      color: #5a5550; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      padding: 0;
      text-decoration: none;
      transition: color .2s;
    }
    .logout-btn:hover { color: #c8c3bc; }

    button.logout-btn {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }

    /* ── FORME ZA SOBE ── */
    .room-forms {
      padding: 4px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .form-group {
      margin-bottom: 8px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #5a5550;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .form-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .form-row input {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      font-weight: 300;
      color: #d0cbc4;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .form-row input::placeholder {
      color: #5a5550;
      font-size: .72rem;
    }

    .form-row input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 2px rgba(42,96,73,.15);
    }

    .form-row button {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      line-height: 1;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s, transform .1s;
    }

    .form-row button:hover {
      background: var(--accent-h);
    }

    .form-row button:active {
      transform: scale(.92);
    }

    .room-action-msg:empty { display: none; }

    .room-action-message {
      margin-top: 9px;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: .7rem;
      line-height: 1.35;
    }

    .room-action-message.error {
      color: #efb1b1;
      background: rgba(185,64,64,.17);
      border: 1px solid rgba(239,177,177,.22);
    }

    .room-action-message.success {
      color: #a9ddc3;
      background: rgba(42,96,73,.3);
      border: 1px solid rgba(169,221,195,.2);
    }

    .room-action-message.info {
      color: #c8c3bc;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header-hash { color: var(--muted); font-size: 1rem; }

    .chat-header-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      letter-spacing: -.01em;
    }

    .room-id {
      margin-left: 8px;
      margin-right: auto;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0,0,0,.05);
      color: var(--muted);
      font-size: .7rem;
    }

    .delete-room-btn {
      border: 1px solid #e3b8b8;
      border-radius: 7px;
      background: #fff5f5;
      color: #9b3535;
      padding: 6px 9px;
      font: inherit;
      font-size: .72rem;
      cursor: pointer;
    }
    .delete-room-btn:hover { background: #fde8e8; }

    .load-older-btn {
      align-self: center;
      margin-bottom: 10px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font: inherit;
      font-size: .78rem;
      cursor: pointer;
    } 
    .load-older-btn:hover { background: var(--bg); }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* date separator */
    .date-sep {
      text-align: center;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin: 16px 0 8px;
      position: relative;
    }
    .date-sep::before, .date-sep::after {
      content: '';
      position: absolute; top: 50%;
      width: 42%; height: 1px;
      background: var(--border);
    }
    .date-sep::before { left: 0; }
    .date-sep::after  { right: 0; }

    .msg {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      font-size: .86rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg .time { color: var(--muted); font-size: .72rem; }

    /* system messages */
    .sys-msg {
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
      font-style: italic;
      margin: 6px 0;
    }

    .room-panel-error {
      margin: auto;
      max-width: 440px;
      padding: 18px 22px;
      border: 1px solid #e3b8b8;
      border-radius: 10px;
      background: #fff5f5;
      color: #9b3535;
      font-size: .85rem;
      text-align: center;
    }

    /* ── INPUT ── */
    .input-area {
      padding: 16px 28px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(42,96,73,.1);
    }

    #msg-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 300;
      color: var(--text);
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #msg-input::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    .send-btn:hover  { background: var(--accent-h); }
    .send-btn:active { transform: scale(.93); }
    .send-btn svg { display: block; }

  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="wordmark">ChatRoom</div>
    <div class="user-pill" id="user-pill" hx-get="/me" hx-trigger="load" hx-swap="outerHTML">
      <div class="avatar" id="user-avatar">?</div>
      <span class="user-name" id="user-display">Preverjam prijavo…</span>
    </div>
  </div>

  <div class="section-label">Rooms</div>
  <div class="room-forms">
  <!-- USTVARI -->
  <form id="create-room-form"
        class="form-group"
        hx-post="/rooms"
        hx-target="#room-action-msg"
        hx-swap="innerHTML">
    <label for="room-name" class="form-label">Nova soba</label>
    <div class="form-row">
      <input type="text"
             id="room-name"
             name="name"
             placeholder="Ime sobe"
             maxlength="32"
             pattern="[A-Za-z0-9_-]+"
             required
             aria-label="Ime nove sobe">
      <button type="submit" aria-label="Ustvari sobo">＋</button>
    </div>
  </form>

  <!-- PRIDRUŽI SE -->
  <form id="join-room-form"
        class="form-group"
        hx-post="/rooms/join"
        hx-target="#room-action-msg"
        hx-swap="innerHTML">
    <label for="room-id" class="form-label">Pridruži se</label>
    <div class="form-row">
      <input type="number"
             id="room-id"
             name="id"
             placeholder="ID sobe"
             required
             aria-label="ID sobe">
      <button type="submit" aria-label="Pridruži se">🔗</button>
    </div>
  </form>

  <div id="room-action-msg" class="room-action-msg" aria-live="polite"></div>
</div>
  <div class="room-list"
     id="room-list"
     hx-get="/rooms"
     hx-trigger="load"
     hx-swap="innerHTML">
   </div>


  <div class="sidebar-footer">
    <button class="logout-btn" type="button" hx-post="/api/logout">Sign out</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main" id="chat-panel"
     hx-get="/rooms/general/panel"
     hx-trigger="load"
     hx-swap="outerHTML">
  <div class="sys-msg">Nalaganje sobe #general…</div>
</div>

<script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
<script src="https://unpkg.com/htmx-ext-ws@2.0.2/ws.js"></script>
</body>
</html>
