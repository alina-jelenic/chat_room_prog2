name: Cargo Build & Test

on:
  push:
  pull_request:

env: 
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build_and_test:
    name: preverjanje, lint in testi (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Namesti stabilni Rust
        run: rustup update stable && rustup default stable
      - name: Namesti rustfmt in Clippy
        run: rustup component add rustfmt clippy
      - name: Preveri oblikovanje
        run: cargo fmt --all -- --check
      - name: Preveri prevajanje celotnega workspacea
        run: cargo check --workspace --all-targets --locked
      - name: Zaženi Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Zaženi vse teste
        run: cargo test --workspace --all-targets --locked --verbose
